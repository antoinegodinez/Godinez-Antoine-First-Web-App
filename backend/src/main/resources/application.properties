spring.application.name=userhub
server.port=8080

# H2 in-memory database (data resets when the backend stops)
spring.datasource.url=jdbc:h2:mem:userhubdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Custom app settings
app.cors.allowed-origin=http://localhost:5173
app.token.ttl-hours=24
app.admin.email=${USERHUB_ADMIN_EMAIL:admin@userhub.local}
app.admin.password=${USERHUB_ADMIN_PASSWORD:ChangeMe123!}
app.admin.full-name=System Administrator
